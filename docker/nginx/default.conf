gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# account.mojprojekt.test SPA (frontend_auth)
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/account;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# gym.mojprojekt.test SPA (frontend_resource)
server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/gym;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
